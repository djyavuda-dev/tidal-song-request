<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Şarkı İste</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="slip">
    <img class="slip__logo" src="/static/logo.jpg" alt="DJ Yavuz" />
    <header class="slip__head">
      <h1>Şarkı iste</h1>
      <p class="slip__sub">Ara, seç, dinlensin. Aynı gece bir kez daha eklenmez.</p>
    </header>

    <div class="search">
      <input id="name" type="text" autocomplete="off"
             placeholder="Adın" maxlength="40" />
      <input id="q" type="text" inputmode="search" autocomplete="off"
             placeholder="Şarkı ya da sanatçı adı" />
    </div>

    <ul id="results" class="results"></ul>
    <p id="status" class="status" role="status" aria-live="polite"></p>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
